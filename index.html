<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https:; font-src 'self' https:; img-src 'self' data: https:; connect-src *" />
    <title>POS Desktop</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
        // Apply the saved appearance before the app starts, so it never flashes the wrong
        // theme or colour. Same keys as src/utils/appearance.js; ThemeContext takes over after.
        (function() {
            var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
            var mode = get('theme'); // 'light' | 'dark' | 'system' (or nothing = system)
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var isDark = mode === 'dark' || ((mode !== 'light') && prefersDark);
            var accents = ['steel', 'teal', 'green', 'violet', 'gold', 'rose'];
            var accent = get('ds.accent');
            var sidebar = get('ds.sidebar');
            var density = get('ds.density');
            var root = document.documentElement;

            root.classList.remove('dark', 'light');
            root.classList.add(isDark ? 'dark' : 'light');
            root.setAttribute('data-theme', isDark ? 'dark' : 'light');
            root.style.colorScheme = isDark ? 'dark' : 'light';
            root.setAttribute('data-accent', accents.indexOf(accent) >= 0 ? accent : 'steel');
            root.setAttribute('data-sidebar', sidebar === 'light' ? 'light' : 'navy');
            root.setAttribute('data-density', density === 'compact' || density === 'comfortable' ? density : 'default');
        })();
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
